name: ZEG Site Monitor

on:
  schedule:
    # Runs once a day at 09:00 UTC (~5am ET). Adjust as needed.
    - cron: "0 9 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

permissions:
  contents: write # needed to commit updated defacement-check hashes back to the repo

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./zeg-monitor
        run: npm install

      - name: Run monitor
        working-directory: ./zeg-monitor
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STUDENTS_TABLE: ${{ vars.SUPABASE_STUDENTS_TABLE }}
          SUPABASE_LOOKUP_COLUMN: ${{ vars.SUPABASE_LOOKUP_COLUMN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          REPORT_RECIPIENTS: ${{ vars.REPORT_RECIPIENTS }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          MONITORED_PAGES: ${{ vars.MONITORED_PAGES }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
        run: npm start
        continue-on-error: true # let it run to completion so we still commit state, even on a failed check

      - name: Commit updated page-hash baseline
        working-directory: ./zeg-monitor
        run: |
          git config user.name "zeg-monitor-bot"
          git config user.email "actions@github.com"
          git add state/page-hashes.json
          git diff --quiet --cached || git commit -m "Update page-hash baseline [automated]"
          git push
